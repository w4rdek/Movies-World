<!DOCTYPE html>
<html>
<head>
    <title>Movies World</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #111;
            color: white;
            margin: 0;
            padding: 20px;
        }

        h1 {
            text-align: center;
        }

        h2 {
            margin-top: 35px;
        }

        .movies {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 15px;
        }

        .card {
            background: #222;
            padding: 20px;
            border-radius: 10px;
            text-align: center;
        }

        button {
            padding: 8px 15px;
            cursor: pointer;
        }
    </style>
</head>

        <div class="card">Movie 4<br><br><button>Watch</button></div>
